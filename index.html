<!doctype html><html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b2135"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>REX Test App</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fa;color:#17324a}header{background:#0b2135;color:#fff;padding:18px 20px}header b{font-size:20px}header small{display:block;color:#cbd7e0;margin-top:4px}main{max-width:900px;margin:auto;padding:18px}.screen{display:none}.screen.active{display:block}nav{display:flex;gap:8px;margin-bottom:18px}nav button{flex:1;padding:12px;border:0;border-radius:9px;background:#e7eef3;color:#17324a;font-weight:700}nav button.active{background:#c69a42;color:white}.box{background:#fff;border:1px solid #d8e1e8;border-radius:12px;padding:18px;margin-bottom:15px}h1{margin:0 0 7px;font-size:25px}p{color:#708294}.status{padding:12px;background:#eaf7ef;border-left:4px solid #19864f;border-radius:7px}.field{margin-top:12px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.field input,.field select{width:100%;padding:11px;border:1px solid #cbd7e0;border-radius:7px}button.primary{margin-top:15px;padding:11px 16px;border:0;border-radius:8px;background:#c69a42;color:#fff;font-weight:700}</style></head><body><header><b>REX BUSINESS GROWTH</b><small>REX Test App • Offline PWA V1</small></header><main><nav><button id="homeBtn" class="active">Dashboard</button><button id="projectBtn">Project Master</button></nav><section id="home" class="screen active"><div class="box"><h1>REX Test App</h1><p>पहिली installable offline web-app foundation.</p><div class="status">System: <b id="status">Checking…</b></div></div><div class="box"><h2>Next Test</h2><p>Project Master उघडणे आणि data browser मध्ये local ठेवणे.</p></div></section><section id="project" class="screen"><div class="box"><h1>Project Master</h1><p>ही V1 मध्ये navigation आणि app-shell test करण्यासाठी आहे.</p><div class="field"><label>Project Name</label><input id="name" placeholder="Project Name"></div><div class="field"><label>Location</label><input id="location" placeholder="Location"></div><div class="field"><label>Status</label><select id="projectStatus"><option>Active</option><option>Planning</option><option>On Hold</option></select></div><button class="primary" id="save">Save Test Data</button><p id="saved"></p></div></section></main><script>const home=document.getElementById('home'),project=document.getElementById('project');const homeBtn=document.getElementById('homeBtn'),projectBtn=document.getElementById('projectBtn');function show(name){home.classList.toggle('active',name==='home');project.classList.toggle('active',name==='project');homeBtn.classList.toggle('active',name==='home');projectBtn.classList.toggle('active',name==='project')}homeBtn.onclick=()=>show('home');projectBtn.onclick=()=>show('project');document.getElementById('save').onclick=()=>{const data={name:document.getElementById('name').value,location:document.getElementById('location').value,status:document.getElementById('projectStatus').value};localStorage.setItem('rex-test-project',JSON.stringify(data));document.getElementById('saved').textContent='Test data saved locally.'};document.getElementById('status').textContent='OFFLINE READY';if('serviceWorker'in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}</script></body></html>
